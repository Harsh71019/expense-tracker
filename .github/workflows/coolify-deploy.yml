name: Coolify deploy

# Runs after CI passes on main: builds images for that exact commit and has
# Coolify roll them out on CT 102. Tagged GHCR releases stay in release.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: treasury-ops-api
            dockerfile: apps/api/Dockerfile
            build-args: ""
          - image: treasury-ops-web
            dockerfile: apps/web/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_URL=/api
              INTERNAL_API_URL=http://api:4000/api
          - image: treasury-ops-proxy
            dockerfile: deployment/proxy.Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/harsh71019/${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: images
    runs-on: [self-hosted, linux, x64, treasury-ops-deploy]
    timeout-minutes: 15
    concurrency:
      group: treasury-ops-coolify
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy verified images and wait for health
        env:
          COOLIFY_URL: http://127.0.0.1:8000/api/v1
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG_VAR: TOPS_IMAGE_TAG
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: python3 scripts/deploy-coolify.py
