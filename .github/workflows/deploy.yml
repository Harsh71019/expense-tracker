name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 192.168.0.226 is a private LAN address -- GitHub's hosted runners have
      # no route to it at all. Join the tailnet for this job so the runner can
      # reach it the same way our phones/n8n do.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy tag to Proxmox
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The key on the server is restricted to a forced command
          # (`command="cd .../treasury-ops && bash deploy.sh \"$SSH_ORIGINAL_COMMAND\""`
          # in authorized_keys), so whatever we pass as the SSH command becomes
          # deploy.sh's tag argument -- it can't run anything else.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@"$DEPLOY_SSH_HOST" \
            "${{ github.ref_name }}"
