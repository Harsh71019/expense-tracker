name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: treasury-ops-api
            dockerfile: apps/api/Dockerfile
            build-args: ""
          - image: treasury-ops-web
            dockerfile: apps/web/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_URL=/api
              INTERNAL_API_URL=http://api:4000/api
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --notes "$(cat <<EOF
          ## Images
          - \`ghcr.io/${{ github.repository_owner }}/treasury-ops-api:${{ github.ref_name }}\`
          - \`ghcr.io/${{ github.repository_owner }}/treasury-ops-web:${{ github.ref_name }}\`

          ## Quickstart (no clone/build required)
          \`\`\`bash
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.release.yml
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/nginx.conf
          curl -o .env https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/env.example
          # fill in .env, then:
          docker compose -f docker-compose.release.yml --env-file .env up -d
          \`\`\`
          EOF
          )"
